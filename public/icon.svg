<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060A17" />
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#007AFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1C2541" stop-opacity="0.6" />
    </linearGradient>

    <!-- Bevel Facet Gradients -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80D0FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2D68C4" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15366D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3D82E0" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73BCFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E4785" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="facetRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0A2246" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2558A5" stop-opacity="0.4" />
    </linearGradient>

    <!-- Pulse Line Gradient (Cyan to Mint Green) -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="65%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#34C759" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Soft Glow -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" />
  
  <!-- Outer Rim Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Inner Ambient Shadow & Glow -->
  <rect x="36" y="36" width="440" height="440" rx="98" ry="98" fill="none" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="2" />

  <!-- 3D Beveled E Frame Outer Structure -->
  <g transform="translate(100, 100)" id="logo-monogram">
    <!-- Top Horizontal Bar -->
    <!-- Outer trapezoid top -->
    <polygon points="0,0 260,0 230,40 30,40" fill="url(#facetTop)" stroke="#68B5FF" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Outer trapezoid bottom -->
    <polygon points="30,40 230,40 210,70 30,70" fill="url(#facetBottom)" stroke="#3072D0" stroke-width="1" stroke-opacity="0.5" />

    <!-- Left Vertical Spine -->
    <!-- Top segment spine -->
    <polygon points="0,0 30,40 30,130 0,130" fill="url(#facetLeft)" stroke="#52A1FF" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Bottom segment spine -->
    <polygon points="0,170 30,170 30,260 0,300" fill="url(#facetLeft)" stroke="#52A1FF" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Inner vertical spine panel -->
    <polygon points="30,70 60,70 60,230 30,230" fill="url(#facetRight)" stroke="#235299" stroke-width="1" stroke-opacity="0.5" />

    <!-- Bottom Horizontal Bar -->
    <polygon points="30,230 210,230 230,260 30,260" fill="url(#facetTop)" stroke="#387FE6" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="0,300 30,260 230,260 260,300" fill="url(#facetBottom)" stroke="#2B62BA" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Right End Caps on Bars -->
    <polygon points="260,0 230,40 230,260 260,300" fill="none" />
    <polygon points="260,0 230,40 210,70 240,30" fill="url(#facetRight)" stroke="#3A7FD9" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="240,270 210,230 230,260 260,300" fill="url(#facetRight)" stroke="#3A7FD9" stroke-width="1" stroke-opacity="0.5" />

    <!-- Glass Facet Bevel Highlights -->
    <line x1="0" y1="0" x2="30" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7" />
    <line x1="260" y1="0" x2="230" y2="40" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="0" y1="300" x2="30" y2="260" stroke="#80D0FF" stroke-width="2" stroke-opacity="0.5" />
    <line x1="260" y1="300" x2="230" y2="260" stroke="#80D0FF" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Glow Backlight for Pulse Line -->
    <path d="M 0,150 L 50,150 L 80,150 L 95,120 L 115,185 L 135,100 L 155,200 L 175,135 L 190,150 L 260,150"
          fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#neonGlow)" opacity="0.65" />

    <!-- Main Vibrant Cardiogram / Pulse Wave (The Center Core of E) -->
    <path d="M 0,150 L 50,150 L 80,150 L 95,120 L 115,185 L 135,100 L 155,200 L 175,135 L 190,150 L 260,150"
          fill="none" stroke="url(#pulseGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Core White Spark on Peak -->
    <path d="M 125,125 L 135,100 L 145,150"
          fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Diagonal Specular Apple Glass Reflection -->
  <path d="M 24,132 C 24,72 72,24 132,24 L 380,24 C 440,24 488,72 488,132 L 488,180 C 350,220 180,270 24,380 Z"
        fill="url(#glassGloss)" />
</svg>
